name: Actualizar datos y publicar app

on:
  schedule:
    # Cada 3 horas entre las 7:00 y las 22:00 (hora peninsular en invierno; en verano, una hora más).
    - cron: "0 6-21/3 * * *"
  workflow_dispatch:   # botón "Run workflow" para actualizar a mano
  push:
    branches: [main]
    paths: ["bot_apuestas/docs/**", "bot_apuestas/*.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

defaults:
  run:
    working-directory: bot_apuestas

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot_apuestas/requirements.txt
      - run: pip install -r requirements.txt
      - name: Descargar datos y calcular probabilidades
        run: python exportar.py
      - name: Guardar datos nuevos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json datos_fotmob/
          git diff --cached --quiet || git commit -m "Datos actualizados $(date -u '+%Y-%m-%d %H:%M')"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bot_apuestas/docs
      - id: deploy
        uses: actions/deploy-pages@v4
